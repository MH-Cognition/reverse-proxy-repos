server {
    listen 80;
    server_name localhost 192.168.2.148 _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name localhost 192.168.2.148 _;

    ssl_certificate /etc/nginx/certs/localhost.pem;
    ssl_certificate_key /etc/nginx/certs/localhost-key.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # -------------------------
    # Health / sanity check
    # -------------------------
    location = /__ping {
        return 200 "nginx-alive\n";
    }

    # -------------------------
    # Identity Service
    # -------------------------
    location ^~ /api/identity/ {
        proxy_pass http://identity:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # -------------------------
    # Tenant Service
    # -------------------------
    location ^~ /api/tenant/ {
        proxy_pass http://tenant:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # -------------------------
    # Notification Service
    # -------------------------
    location ^~ /api/notification/ {
        proxy_pass http://notification:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # -------------------------
    # Institution Service
    # -------------------------
    location ^~ /api/institution/ {
        proxy_pass http://institution:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # -------------------------
    # Media Service
    # -------------------------
    location ^~ /api/media/ {
        proxy_pass http://media:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name localhost 192.168.0.4 192.168.2.148 192.168.2.248 _;

    # -------------------------
    # Health / sanity check
    # -------------------------
    location = /__ping {
        return 200 "nginx-alive\n";
    }

    # -------------------------
    # Identity Service
    # -------------------------
    location ^~ /api/identity/ {
        proxy_pass http://identity:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # -------------------------
    # Tenant Service
    # -------------------------
    location ^~ /api/tenant/ {
        proxy_pass http://tenant:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # -------------------------
    # Notification Service
    # -------------------------
    location ^~ /api/notification/ {
        proxy_pass http://notification:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # -------------------------
    # Institution Service
    # -------------------------
    location ^~ /api/institution/ {
        proxy_pass http://institution:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # -------------------------
    # Media Service
    # -------------------------
    location ^~ /api/media/ {
        proxy_pass http://media:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
